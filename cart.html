<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Denture Fix</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- 
        TODO: SHOPIFY CHECKOUT INTEGRATION
        
        To enable Shopify checkout, you need to:
        
        1. Include the Shopify Buy Button SDK (if not already included):
           <script src="https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js"></script>
        
        2. Initialize the SDK with your store credentials in script.js
        
        3. Update the handleCheckout() function in script.js to:
           - Create a Shopify checkout session
           - Add cart items to the checkout
           - Redirect to Shopify checkout URL
        
        Alternative: Direct Checkout URL
        You can also redirect directly to Shopify cart URL:
        https://YOUR_STORE.myshopify.com/cart/VARIANT_ID:QUANTITY
        
        For multiple items:
        https://YOUR_STORE.myshopify.com/cart/VARIANT_ID_1:1,VARIANT_ID_2:1
    -->
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <h1>Denture Fix</h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                    <li><a href="cart.html" class="cart-btn active">Cart (<span id="cart-count">0</span>)</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h2>Your Cart</h2>
            </div>
        </section>

        <section class="cart-content">
            <div class="container">
                <div id="cart-items" class="cart-items">
                    <!-- Cart items will be dynamically inserted here -->
                </div>
                
                <div id="cart-empty" class="cart-empty" style="display: none;">
                    <p>Your cart is empty</p>
                    <a href="services.html" class="btn btn-primary">Browse Services</a>
                </div>

                <div id="cart-summary" class="cart-summary" style="display: none;">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal">£0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="cart-total">£0.00</span>
                    </div>
                    <button id="checkout-btn" class="btn btn-primary btn-block">Proceed to Checkout</button>
                    <a href="services.html" class="btn btn-secondary btn-block">Continue Shopping</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Denture Fix. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
